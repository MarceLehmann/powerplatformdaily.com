name: Auto GIF probe
# NUR FUER DEN FEATURE-BRANCH: prueft, ob Rendern und Seitenbau auf dem Actions-Runner funktionieren.
# Committet und deployt nichts. Diese Datei VOR DEM MERGE LOESCHEN.
on:
  push:
    branches: [feature/auto-gif]
    paths:
      - ".github/workflows/auto-gif-probe.yml"
      - "tools/animation/test/**"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System packages for Remotion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2
          ffmpeg -version | head -1
      - name: Install Remotion
        working-directory: tools/animation
        run: npm install --no-audit --no-fund
      - name: Unit tests
        working-directory: tools/animation
        run: node --test animation.test.mjs
      - name: Render from the probe decisions (no AI call)
        run: |
          start=$(date +%s)
          node tools/animation/run.mjs --root . --site-url powerplatformdaily.com --days 5 --decisions tools/animation/test/decisions-ci-probe.json
          echo "Render took $(( $(date +%s) - start )) s"
          ls -la assets/img/animations
      - uses: actions/upload-artifact@v4
        with:
          name: probe-animations
          path: assets/img/animations
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Build and check the site with the animation
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build
          bundle exec ruby tools/check-site.rb
          bundle exec htmlproofer _site --disable-external
