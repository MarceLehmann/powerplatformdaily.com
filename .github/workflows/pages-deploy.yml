name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Launch switch consistency
        run: |
          launch=$(grep -E '^launch:' _config.yml | awk '{print $2}')
          if [ "${{ vars.SITE_LIVE }}" = "true" ] && [ "$launch" != "true" ]; then
            echo "::warning::SITE_LIVE is true but launch is $launch in _config.yml. Flip both switches together (docs/2026-09-30_go-live-runbook.md)."
          fi
          if [ "${{ vars.SITE_LIVE }}" != "true" ] && [ "$launch" = "true" ]; then
            echo "::warning::launch is true but the variable SITE_LIVE is not set, so IndexNow and the digest stay off."
          fi

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"
          SUBMISSION_ENDPOINT: ${{ secrets.SUBMISSION_ENDPOINT }}

      - name: Test automation contracts
        run: |
          node --test tools/*.test.mjs
          python3 -m py_compile tools/render_card.py tools/send_digest.py
          bundle exec ruby tools/test-publish-curation.rb
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Check rendered site
        run: bundle exec ruby tools/check-site.rb "_site${{ steps.pages.outputs.base_path }}"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"
          name: github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
